<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#111827" />
<meta name="robots" content="noindex,follow" />
<link rel="stylesheet" href="./styles.css" />
<title>プロフィール編集 — BOYAKI</title>
</head>
<body>
<header class="shell topbar">
<a class="brand" href="./">BOYAKI</a>
<nav>
<a class="nav-link" href="./">新着</a>
<a class="nav-link" href="./makers.html">Maker Space</a>
<a class="nav-link" href="./mypage.html">マイページ</a>
</nav>
</header>
<main class="shell maker-space">
<section class="card hero maker-hero">
<p class="eyebrow">BOYAKI Account</p>
<h1>プロフィール編集</h1>
<p class="lead">表示名・興味・ひとことを更新します。アカウント鍵やログインパスワードはここでは変更しません。</p>
<div id="edit-state" class="hint" role="status" aria-live="polite">読み込み中…</div>
</section>
<section class="card participation-panel">
<form id="profile-edit-form" class="maker-form">
<label>表示名 / Display name
<input id="edit-name" maxlength="40" autocomplete="nickname" required />
</label>
<label>主に興味があること / Main interest
<select id="edit-interest">
<option value="both">Voice と Maker の両方</option>
<option value="voice">Voice — 困りごと・検証側</option>
<option value="maker">Maker — 解決を作る側</option>
</select>
</label>
<label>ひとこと / About (optional)
<textarea id="edit-about" maxlength="240" rows="4"></textarea>
</label>
<div class="actions">
<button type="submit">プロフィールを更新</button>
<a class="button-link" href="./mypage.html">キャンセル</a>
</div>
</form>
</section>
</main>
<script type="module" src="./profile-edit.js?v=20260904-v1"></script>
</body>
</html>
