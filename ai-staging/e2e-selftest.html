<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>BOYAKI STAGING E2E Self-test</title>
  <style>
    body{font-family:system-ui,sans-serif;margin:0;background:#f6f7f9;color:#111827}
    main{max-width:900px;margin:0 auto;padding:32px 20px}
    .banner{padding:10px 16px;text-align:center;font-weight:800;background:#fff3cd;border-bottom:2px solid #8a6d00;color:#332701}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(17,24,39,.06)}
    button{border:0;border-radius:12px;background:#111827;color:#fff;padding:12px 16px;font-weight:700;cursor:pointer}
    button:disabled{opacity:.55;cursor:wait}
    pre{white-space:pre-wrap;word-break:break-word;background:#0b1020;color:#e5e7eb;padding:16px;border-radius:14px;min-height:220px;overflow:auto}
    .hint{color:#667085;font-size:14px;line-height:1.6}
    .pass{color:#067647;font-weight:700}.fail{color:#b42318;font-weight:700}.skip{color:#b54708;font-weight:700}
  </style>
</head>
<body>
  <div class="banner">STAGING / AUTOMATED E2E — 本番ではありません</div>
  <main>
    <section class="card">
      <h1>BOYAKI STAGING E2E Self-test</h1>
      <p class="hint">実ユーザーのAccountやログインキーは使いません。毎回その場で一時的な暗号鍵を生成し、STAGING Supabaseだけを対象に Account所有・跨端末権限・旧browser ID引継ぎ・通報・canonical thread（追加質問/解決案/投稿者返答）・Nostr plaintext freeze guardを検証します。本番project refが検出された場合は実行を拒否します。</p>
      <p><button id="run" type="button">E2Eを実行</button></p>
      <div id="summary" role="status" aria-live="polite"></div>
      <pre id="output">待機中</pre>
    </section>
  </main>
  <script type="module" src="./e2e-selftest.js?v=20260909-v2"></script>
</body>
</html>
