<title>Productを作る — BOYAKI</title></head><body>
<header class="shell topbar"><a class="brand" href="./">BOYAKI</a><nav>
      <a class="nav-link" href="./">ホーム</a>
      <a class="nav-link" href="./discover/">問題を探す</a>
      <a class="nav-link active" href="./products.html">Product</a>
      <a class="nav-link" href="./mypage.html">マイページ</a>
    </nav></header>
<main class="shell maker-space">
<div class="journey-guide" aria-label="BOYAKIの流れ">
  <div class="journey-step is-done"><strong>ボヤく</strong><span>一言から</span></div>
  <div class="journey-step is-done"><strong>話し合う</strong><span>困りごとを具体化</span></div>
  <div class="journey-step is-done"><strong>一緒に解決</strong><span>解決をまとめる</span></div>
  <div class="journey-step is-current"><strong>Product</strong><span>届ける</span></div>
</div>
<section class="card hero"><p class="eyebrow">解決メモ → Product</p><h1>Productを作る</h1><p class="lead">一緒に作った解決を、Voiceが受け取れるProductとして保存します。</p><div class="transition-note"><strong>この時点では元の困りごとには掲載されません</strong><span>ここではProduct本体を作ります。作成後に、元の困りごとへ掲載するかをMakerが選べます。</span></div><p class="hint">価格はテスト用に記録されますが、実際の決済・送金は発生しません。</p></section>
<section class="card" id="product-case"><p class="hint">解決メモを読み込んでいます…</p></section>
<section class="card">
<form id="product-form" class="maker-form">
<label>商品名<input id="product-title" maxlength="120" required placeholder="例: Excel転記を自動化するテンプレート"></label>
<label>Voiceに見せる説明<textarea id="product-description" maxlength="1200" rows="5" required placeholder="何が解決され、誰向けか"></textarea></label>
<label>価格（円）<input id="product-price" type="number" min="1" max="1000000" step="1" inputmode="numeric" required placeholder="500"></label>
<label>購入後に渡す内容<textarea id="product-delivery" maxlength="20000" rows="9" required placeholder="ダウンロード先、使い方、コード、テンプレートURLなど。購入前には表示されません。"></textarea></label>
<div class="actions"><button id="product-submit" type="submit">Productを作成</button><a class="button-link" href="./mypage.html#maker">戻る</a></div>
<div id="product-status" class="hint" role="status" aria-live="polite"></div>
</form>
</section>
</main>
<footer class="shell site-footer"><a class="footer-link" href="./?about=1">BOYAKIとは？</a><a class="footer-link" href="./bug-report.html">バグ報告</a></footer>
<script type="module" src="./product-create.js?v=20260920-consolidated-v2"></script>
</body></html>
